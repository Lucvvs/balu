services:
  # Servicio web (Django app)
  - type: web
    name: motomoto-web
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn motomoto.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # ALLOWED_HOSTS se configura automáticamente para aceptar .onrender.com
      # Si necesitas un dominio específico, descomenta y configura:
      # - key: ALLOWED_HOSTS
      #   value: balu-c7hx.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: motomoto-db
          property: connectionString
    healthCheckPath: /
    plan: free  # Cambia a 'starter' o 'standard' para producción

  # Base de datos PostgreSQL
  - type: pg
    name: motomoto-db
    plan: free  # Cambia a 'starter' o 'standard' para producción
    databaseName: motomoto
    user: motomoto_user

