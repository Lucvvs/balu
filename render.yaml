services:
  # Servicio web (Django app)
  - type: web
    name: motomoto-web
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn motomoto.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: motomoto-db
          property: connectionString
    healthCheckPath: /
    plan: free  # Cambia a 'starter' o 'standard' para producción

databases:
  # Base de datos PostgreSQL
  - name: motomoto-db
    plan: free  # Cambia a 'starter' o 'standard' para producción