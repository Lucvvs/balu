services:
  # Servicio web (Django app)
  - type: web
    name: motomoto-web
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn motomoto.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"   # cambiar luego por el dominio real
      - key: DATABASE_URL
        fromDatabase:
          name: motomoto-db
          property: connectionString
    healthCheckPath: /
    plan: free

databases:
  - name: motomoto-db
    type: postgresql
    plan: free
    databaseName: motomoto
    user: motomoto_user